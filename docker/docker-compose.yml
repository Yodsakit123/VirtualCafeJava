version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: virtual_cafe_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: virtual_cafe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: virtual_cafe_api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/virtual_cafe
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres

volumes:
  pgdata:
